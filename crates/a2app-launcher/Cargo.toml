[package]
name = "a2app-launcher"
version = "2.0.1"
edition = "2024"
license.workspace = true
description = "Launches the a2app harness + Makepad host and deploys a Splash app"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
eyre = { workspace = true }

[[bin]]
name = "a2app-launch"
path = "src/main.rs"
