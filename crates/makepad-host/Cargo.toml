[package]
name = "makepad-host"
version = "2.0.1"
edition = "2024"
license.workspace = true
description = "Makepad native UI host for rendering Splash DSL apps — launched by octos profiles"

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "cb93fa982231ab42655e15fdb2d2eaeb60bc64d3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures = "0.3"
tracing = "0.1"
url = "2"
libc = "0.2"

[lints]
workspace = true
